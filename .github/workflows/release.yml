name: Build

# Every push to main builds and tests; the builds are kept as workflow artifacts.
# Pushing a tag like v0.2.0 also publishes a GitHub release with the downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
    # Notes-only pushes to main don't need a build (path filters don't apply to tags: a release always builds).
    paths-ignore: ["CLAUDE.md", "README.md", "CREDITS.md"]
  workflow_dispatch:

# A newer push to main cancels the build still running for an older one; a release is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

# Three jobs: the simulation tests and the Godot build (self-test + exports) run side by side; the release is
# published only once both have passed.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # Release: the long games in the suite run about three times faster optimised.
      - name: Simulation tests
        run: dotnet test tests/StationX.Sim.Tests -c Release --nologo

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono-slim

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep -E "mono_linux_x86_64.zip|mono_export_templates.tpz" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -d tpz
          # Only the two templates the exports use (64-bit Linux and Windows release): the full set is 1.9 GB, and
          # restoring it from the cache took longer than everything else before the self-test.
          for f in linux_release.x86_64 windows_release_x86_64.exe icudt_godot.dat version.txt; do mv "tpz/templates/$f" "$tpl/"; done
          rm -rf tpz *.zip *.tpz

      - name: Import project
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" --headless --path . --import || true

      # Compiled shaders and Vulkan pipelines from earlier runs. Compiling them in software (no GPU here) took
      # ~40 s before the self-test's first check. Each run saves a fresh copy; stale entries are simply unused.
      - name: Cache compiled shaders
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/godot/app_userdata/Station X/shader_cache
            ~/.local/share/godot/app_userdata/Station X/vulkan
          key: shaders-${{ env.GODOT_VERSION }}-${{ github.run_id }}
          restore-keys: shaders-${{ env.GODOT_VERSION }}-

      - name: UI self-test (virtual display)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers pigz > /dev/null
          dotnet build StationX.csproj --nologo -v q
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 600 "$GODOT" --path . --resolution 1600x900 -- --selftest

      - name: Stamp the version (tags only; the in-game updater compares it with the latest release)
        if: startsWith(github.ref, 'refs/tags/v')
        run: sed -i "s/^config\/name=.*/&\nconfig\/version=\"${GITHUB_REF_NAME#v}\"/" project.godot && grep config/version project.godot

      - name: Export Linux and Windows
        run: ./export.sh

      - uses: actions/upload-artifact@v7
        with:
          name: StationX-${{ github.sha }}
          path: |
            build/*.zip
            build/*.tar.gz
            build/*.txt
            build/*.pck
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # history and tags, for the release notes

      - uses: actions/download-artifact@v8
        with:
          name: StationX-${{ github.sha }}
          path: build

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: the annotated tag's message (what's new, what's fixed), then every commit since the last tag.
          git fetch --force --tags origin
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)
          {
            git tag -l --format='%(contents)' "$GITHUB_REF_NAME" | sed '1{/^v[0-9]/d}' | sed '/^-----BEGIN PGP/,$d'
            echo
            echo "### All changes${prev:+ since $prev}"
            git log --no-merges --format='- %s' ${prev:+$prev..}"$GITHUB_REF_NAME"
            echo
            echo "### Downloads"
            echo "- **Linux**: \`StationX-linux-x86_64.tar.gz\`"
            echo "- **Windows**: \`StationX-windows-x86_64.zip\`"
          } > release-notes.md
          cat release-notes.md
          gh release create "$GITHUB_REF_NAME" build/*.zip build/*.tar.gz build/*.txt build/*.pck \
            --title "Station X $GITHUB_REF_NAME" --notes-file release-notes.md
