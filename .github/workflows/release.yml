name: Build

# Every push to main builds and tests; the builds are kept as workflow artifacts.
# Pushing a tag like v0.2.0 also publishes a GitHub release with the downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Simulation tests
        run: dotnet test tests/StationX.Sim.Tests --nologo

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-mono

      - name: Download Godot and export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot && cd ~/godot
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          curl -fsSLO "$base/Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep -E "mono_linux_x86_64.zip|mono_export_templates.tpz" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64.zip"
          tpl=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.mono
          mkdir -p "$tpl"
          unzip -q "Godot_v${GODOT_VERSION}-stable_mono_export_templates.tpz" -d tpz
          mv tpz/templates/* "$tpl/"
          rm -rf tpz *.zip *.tpz

      - name: Import project
        run: |
          echo "GODOT=$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          "$HOME/godot/Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64/Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" --headless --path . --import || true

      - name: UI self-test (virtual display)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers > /dev/null
          dotnet build StationX.csproj --nologo -v q
          xvfb-run -a -s "-screen 0 1600x900x24" timeout 600 "$GODOT" --path . --resolution 1600x900 -- --selftest

      - name: Screenshots
        run: |
          mkdir -p shots
          shot() { xvfb-run -a -s "-screen 0 1600x900x24" timeout 300 "$GODOT" --path . --resolution 1600x900 -- --shot="$PWD/shots/$1.png" "${@:2}" || true; }
          shot park --days=22 --hour=14 --zoom=0.85 --center=24,14
          shot breakdown --days=30 --hour=11 --zoom=1.8 --breakdown --select=bombe
          shot staff --days=16 --hour=11 --panel=staff
          shot winter --days=80 --hour=10 --zoom=1.5 --center=26,6
          shot alerts --days=30 --hour=11 --breakdown
          shot end --days=3 --modal=end
          shot snow --days=80 --hour=11 --zoom=1.0 --center=24,14 --weather=snow
          shot head --days=20 --hour=11 --zoom=1.5 --center=26,6 --head=hut6
          shot mansion --days=80 --hour=11 --zoom=1.7 --center=10,7
          shot raid --days=40 --hour=23 --zoom=0.7 --center=24,14 --raid
          shot rain --days=40 --hour=15 --zoom=1.0 --center=24,14 --weather=storm
          ls -l shots

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: shots/
          retention-days: 7

      - name: Export Linux and Windows
        run: ./export.sh

      - uses: actions/upload-artifact@v4
        with:
          name: StationX-${{ github.sha }}
          path: |
            build/*.zip
            build/*.tar.gz
          retention-days: 14

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/*.zip build/*.tar.gz \
            --title "Station X $GITHUB_REF_NAME" --generate-notes
